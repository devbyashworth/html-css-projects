<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pro Parallax</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <!-- HERO -->
      <section class="hero">
        <div class="layer bg-back"></div>
        <div class="layer bg-mid"></div>
        <div class="layer bg-front"></div>
        <div class="overlay"></div>

        <div class="content">
          <div class="glass">
            <h1>PRO PARALLAX</h1>
          </div>
        </div>
      </section>

      <!-- SECTION 1 -->
      <section class="section">
        <div class="layer bg-mid"></div>
        <div class="overlay"></div>

        <div class="content">
          <h2>Smooth Depth</h2>
        </div>
      </section>

      <!-- SECTION 2 -->
      <section class="section">
        <div class="layer bg-back"></div>
        <div class="overlay"></div>

        <div class="content">
          <h2>Multi Layer Motion</h2>
        </div>
      </section>

      <!-- SECTION 3 -->
      <section class="section">
        <div class="layer bg-front"></div>
        <div class="overlay"></div>

        <div class="content">
          <h2>Premium Feel</h2>
        </div>
      </section>
    </main>
  </body>
</html>
