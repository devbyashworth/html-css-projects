<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Dev by Ashworth — web development and digital services."
    />

    <title>Dev by Ashworth | Footer</title>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />

    <!-- Material Symbols -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <footer class="site-footer">
      <div class="footer-top">
        <div class="footer-intro">
          <h2>Contact Us</h2>

          <p class="footer-message">
            Have any questions? Feel free to reach out to us!
          </p>

          <a href="#contact" class="schedule-button">
            <span>Schedule a Call</span>

            <span class="material-symbols-outlined" aria-hidden="true">
              arrow_forward
            </span>
          </a>
        </div>

        <nav class="footer-links" aria-label="Footer navigation">
          <div class="footer-column">
            <h2>Company</h2>

            <ul>
              <li><a href="/">Home</a></li>
              <li><a href="/about">About</a></li>
              <li><a href="/services">Services</a></li>
              <li><a href="/contact">Contact</a></li>
            </ul>
          </div>

          <div class="footer-column">
            <h2>Resources</h2>

            <ul>
              <li><a href="/blog">Blog</a></li>
              <li><a href="/faq">FAQs</a></li>
              <li><a href="/support">Support</a></li>
              <li><a href="/privacy">Privacy Policy</a></li>
            </ul>
          </div>
        </nav>
      </div>

      <div class="footer-bottom">
        <p class="copyright">
          &copy;
          <span id="year"></span>
          Dev by Ashworth. All rights reserved.
        </p>

        <div class="socials" aria-label="Social media links">
          <a href="#" aria-label="Facebook" class="fa-brands fa-facebook-f"></a>

          <a href="#" aria-label="X" class="fa-brands fa-x-twitter"></a>

          <a href="#" aria-label="Instagram" class="fa-brands fa-instagram"></a>

          <a
            href="#"
            aria-label="LinkedIn"
            class="fa-brands fa-linkedin-in"
          ></a>
        </div>
      </div>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
