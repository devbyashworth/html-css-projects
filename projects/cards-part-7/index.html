<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards</title>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <img src="./dev_by_ashworth.png" alt="Logo" class="image" />
      <div class="content">
        <h2>Ashworth Sakara</h2>

        <h3>Frontend Developer</h3>

        <p>
          I build responsive, accessible, and modern web applications using
          React, JavaScript, Tailwind CSS, and the latest frontend technologies.
          Passionate about creating intuitive user experiences and clean,
          maintainable code.
        </p>
        <div class="footer">
          <div class="details">
            <span class="item">React</span>
            <span class="item">JavaScript</span>
            <span class="item">Tailwind CSS</span>
          </div>
          <div class="buttons">
            <button class="primary-btn">Follow</button>
            <button class="icon-btn">
              <span class="material-symbols-outlined"> favorite </span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
