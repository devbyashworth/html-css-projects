<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#121827" />
    <meta name="description" content="Developer portfolio footer." />

    <title>Footer | Portfolio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Phosphor Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <!-- Your portfolio content goes here -->
    </main>

    <footer class="footer">
      <!-- Decorative SVG Background -->
      <div class="background" aria-hidden="true">
        <svg
          class="background-svg"
          viewBox="0 0 1440 400"
          preserveAspectRatio="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <defs>
            <linearGradient id="footerGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2563eb" />
              <stop offset="100%" stop-color="#7c3aed" />
            </linearGradient>

            <filter id="blurEffect">
              <feGaussianBlur stdDeviation="35" />
            </filter>
          </defs>

          <ellipse
            cx="720"
            cy="400"
            rx="550"
            ry="180"
            fill="url(#footerGradient)"
            opacity="0.22"
            filter="url(#blurEffect)"
          />

          <path
            d="M0 270 Q360 100 720 270 T1440 250 V400 H0 Z"
            fill="#2563eb"
            opacity="0.08"
          />

          <path
            d="M0 330 Q360 180 720 310 T1440 290 V400 H0 Z"
            fill="#7c3aed"
            opacity="0.10"
          />
        </svg>
      </div>

      <div class="footer-content">
        <!-- Social Links -->
        <ul class="socials" aria-label="Social media links">
          <li>
            <a
              href="https://github.com/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub"
              data-tooltip="GitHub"
            >
              <i class="ph ph-github-logo"></i>
            </a>
          </li>

          <li>
            <a
              href="https://codepen.io/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="CodePen"
              data-tooltip="CodePen"
            >
              <i class="ph ph-codepen-logo"></i>
            </a>
          </li>

          <li>
            <a
              href="https://linkedin.com/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
              data-tooltip="LinkedIn"
            >
              <i class="ph ph-linkedin-logo"></i>
            </a>
          </li>

          <li>
            <a
              href="https://x.com/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="X"
              data-tooltip="X"
            >
              <i class="ph ph-x-logo"></i>
            </a>
          </li>

          <li>
            <a
              href="https://instagram.com/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Instagram"
              data-tooltip="Instagram"
            >
              <i class="ph ph-instagram-logo"></i>
            </a>
          </li>
        </ul>

        <!-- Footer Navigation -->
        <nav aria-label="Footer navigation">
          <ul class="links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#portfolio">Portfolio</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
        </nav>

        <!-- Copyright -->
        <p class="legal">
          &copy; <span id="year"></span>
          <a href="#home" class="brand">Dev by Ashworth</a>. All Rights
          Reserved.
        </p>
      </div>
    </footer>

    <script>
      // Automatically update copyright year
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
