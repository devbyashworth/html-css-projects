<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards</title>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <img
        src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?w=1200&q=80"
        alt="Eiffel Tower in Paris"
        class="image"
      />
      <div class="content">
        <h2>Discover Paris</h2>

        <h3>Economy Class</h3>

        <p>
          Experience the charm of Paris with affordable flights, flexible travel
          dates, and premium onboard comfort. Explore iconic landmarks,
          world-class cuisine, and unforgettable culture.
        </p>

        <a href="#" class="read-more">Read More</a>

        <div class="details">
          <span class="item">
            <span class="material-symbols-outlined">sell</span>
            <em>From $120</em>
          </span>

          <span class="item">
            <span class="material-symbols-outlined">flight</span>
            <em>Direct Flight</em>
          </span>
        </div>

        <div class="buttons">
          <button class="primary-btn">Search Flights</button>

          <button class="icon-btn">
            <span class="material-symbols-outlined"> favorite </span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
