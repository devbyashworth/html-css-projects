<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <img src="./logo.jpg" class="top-avatar" />
      <div class="main">
        <h2>Google</h2>
        <h3>Senior</h3>
        <h4>Front-End Developer</h4>
        <h5>World Wide <em>(Remote)</em></h5>
      </div>
      <div class="details">
        <span class="salary">35k <em>/month</em></span>
        <span class="date">2 weeks ago</span>
      </div>
      <div class="footer">
        <div class="badge">
          <img src="./logo.jpg" class="bottom-avatar" />
          <p><em>74%</em> <span class="text">Profile Match</span></p>
        </div>
        <button>
          <span class="material-symbols-outlined">share</span>
        </button>
        <button>
          <span class="material-symbols-outlined">bookmark</span>
        </button>
      </div>
    </div>
  </body>
</html>
